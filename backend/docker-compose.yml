services:
  transcend-backend:
    container_name: transcend-backend
    image: transcend-backend:latest
    build:
      context: .
      dockerfile: transcend/Dockerfile
    env_file:
      - transcend/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/actuator/health"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 210s
    restart: unless-stopped

networks:
  default:
    external: true
    name:  transcend-net