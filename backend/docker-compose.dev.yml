services:
  transcend-backend:
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
  transcend-backend-test:
    container_name: transcend-backend-test
    build:
      context: .
      dockerfile: transcend/Dockerfile.test
    env_file:
      - transcend/.env
    environment:
      - SPRING_PROFILES_ACTIVE=test,dev
    command: ["sh", "-c", "gradle test --no-daemon"]
    profiles:
      - test

networks:
  default:
    external: true
    name: transcend-net
