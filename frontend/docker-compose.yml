services:
  transcend-frontend:
    container_name: transcend-frontend
    image: transcend-frontend:latest
    build:
      context: .
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  default:
    external: true
    name: transcend-net