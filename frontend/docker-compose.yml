services:
  transcend-frontend:
    container_name: transcend-frontend
    image: transcend-frontend:latest
    build:
      context: .
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  default:
    external: true
    name: transcend-net