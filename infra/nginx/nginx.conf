map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $cookie_auth_token $auth_header {
    default "Bearer $cookie_auth_token";
    ""      "";
}

server {
    listen 443 ssl;
    server_name localhost;

    # Resolve transcend-backend at request time (Docker's embedded DNS)
    # instead of once at nginx startup, so nginx doesn't fail to start
    # entirely just because the backend container isn't up yet.
    resolver 127.0.0.11 valid=10s;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Optional SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

    # Redirect HTTP requests to HTTPS
    error_page 497 =301 https://$http_host$request_uri;

    # Reverse proxy for the backend API and WebSockets
    location /api/ {
        set $backend_upstream transcend-backend:5000;
        # proxy_pass loses its automatic "strip the location prefix"
        # rewrite once the target uses a variable (needed for dynamic
        # resolution above) — nginx just passes the original URI through
        # unchanged instead. Strip /api/ ourselves so the backend still
        # sees the same paths it always did (e.g. /api-docs, not /api/api-docs).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;

        # WebSocket specific headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Inject Authorization header from auth_token cookie
        proxy_set_header Authorization $auth_header;
        
        # Standard forwarding headers
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Host localhost:8443;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Server localhost;
    }

    # Reverse proxy for the frontend
    location / {
        set $frontend_upstream transcend-frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Host localhost:8443;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Server localhost;
    }
}