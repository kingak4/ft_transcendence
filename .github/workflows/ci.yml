name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/setup-backend-test
      - uses: ./.github/actions/setup-infra

      - name: Start infrastructure
        working-directory: infra
        run: make run

      - name: Run PROD backend tests
        working-directory: backend
        run: make test

      - name: Run DEV backend tests
        working-directory: backend
        run: make -f Makefile.dev test
          
  prod:
    name: Evaluation Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-infra

      - name: Start infra
        working-directory: infra
        run: make run

      - name: Start backend
        working-directory: backend
        run: make run

      - uses: ./.github/actions/setup-frontend

      - name: Start frontend
        working-directory: frontend
        run: make run

      - name: Validate Frontend is accessible via https
        working-directory: backend
        run: make check-endpoints

      - name: Show backend logs on failure
        if: failure()
        working-directory: backend
        run: docker compose -p transcend logs transcend-backend

      - name: Show frontend logs on failure
        if: failure()
        working-directory: frontend
        run: docker compose -p transcend logs transcend-frontend

  dev-backend:
    name: Dev Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-infra

      - name: Start infra
        working-directory: infra
        run: make run

      - name: Start backend (local profile — published on loopback :5001)
        working-directory: backend
        run: make -f Makefile.dev up
      
      - name: Validate Endpoints are exposed for Local frontend development
        working-directory: backend
        run: make -f Makefile.dev check-endpoints

      - name: Show backend logs on failure
        if: failure()
        working-directory: backend
        run: make logs