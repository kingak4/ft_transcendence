name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env

      - name: Start infrastructure
        working-directory: infra
        run: make

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: backend/.gradle-docker-cache
          key: gradle-docker-${{ runner.os }}-${{ hashFiles('backend/transcend/build.gradle.kts') }}
          restore-keys: |
            gradle-docker-${{ runner.os }}-

      - name: Run PROD backend tests
        working-directory: backend
        run: |
          mkdir -p .gradle-docker-cache
          make test
      - name: Run DEV backend tests
        working-directory: backend
        run: |
          mkdir -p .gradle-docker-cache
          make -f Makefile.dev test
          
  prod:
    name: Evaluation Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env

      - name: Set up Docker Buildx Cache
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/transcend/Dockerfile
          load: true
          tags: transcend-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start infra
        working-directory: infra
        run: make up

      - name: Start backend
        working-directory: backend
        run: make up

      - uses: ./.github/actions/setup-frontend

      - name: Start frontend
        working-directory: frontend
        run: make up

      - name: Show backend logs on failure
        if: failure()
        working-directory: backend
        run: docker compose -p transcend logs transcend-backend

      - name: Show frontend logs on failure
        if: failure()
        working-directory: frontend
        run: docker compose -p transcend logs transcend-frontend