name: 'Setup Infrastructure'
description: 'Pre-builds infrastructure Docker images using Docker Buildx and GHA cache'

inputs:
  infra-path:
    description: 'Path to infra directory'
    required: false
    default: './infra'

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Read Postgres .env for Docker Build
      id: postgres-env
      shell: bash
      run: |
        ENV_FILE="${{ inputs.infra-path }}/postgres/.env"
        if [ -f "$ENV_FILE" ]; then
          {
            echo "args<<EOF"
            grep -v '^[[:space:]]*#' "$ENV_FILE" | grep '='
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Pre-build Postgres image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.infra-path }}/postgres
        build-args: ${{ steps.postgres-env.outputs.args }}
        load: true
        tags: postgres-db:latest
        cache-from: type=gha,scope=infra-postgres
        cache-to: type=gha,mode=max,scope=infra-postgres

    - name: Read Nginx .env for Docker Build
      id: nginx-env
      shell: bash
      run: |
        ENV_FILE="${{ inputs.infra-path }}/nginx/.env"
        if [ -f "$ENV_FILE" ]; then
          {
            echo "args<<EOF"
            grep -v '^[[:space:]]*#' "$ENV_FILE" | grep '='
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Pre-build Nginx image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.infra-path }}/nginx
        build-args: ${{ steps.nginx-env.outputs.string_values }}
        load: true
        tags: nginx:latest