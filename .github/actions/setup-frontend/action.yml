name: Setup frontend CI
description: Configure Node, cache frontend build output, and generate typed API clients.
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Cache Next.js build
      uses: actions/cache@v4
      with:
        path: frontend/.next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

    - name: Generate API types
      shell: bash
      working-directory: frontend
      run: make generate