name: Setup frontend CI
description: Configure Node, generate API clients, and pre-build Docker image with Buildx cache.
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Frontend clean install
      shell: bash
      working-directory: frontend
      run: make -f Makefile.local ci

    - name: Generate API types
      shell: bash
      working-directory: frontend
      run: make -f Makefile.local generate

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Pre-build frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        load: true
        tags: transcend-frontend:latest
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,mode=max,scope=frontend